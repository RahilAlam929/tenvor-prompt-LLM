[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tenvor-prompt"
version = "0.1.0"
description = "Universal prompt engineering platform"
requires-python = ">=3.9"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "typer",
    "rich",
    "httpx",
]

[project.scripts]
tenvor-prompt = "cli.tenvor_prompt.main:app"

[tool.setuptools.packages.find]
include = ["services*", "packages*", "cli*"]
