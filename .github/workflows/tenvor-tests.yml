name: Tenvor Tests

on:
  push:
    branches: [main]
    paths:
      - "training/**"
      - ".github/workflows/tenvor-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "training/**"
      - ".github/workflows/tenvor-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: training

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: training/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v
